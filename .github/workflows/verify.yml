name: Verify

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    name: Verify
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Lint rule check
        run: node scripts/lint-rule-check.mjs

      - name: Lint
        run: node scripts/lint.mjs

      - name: Preview KV stays off production
        run: node scripts/check-preview-kv.mjs

      - name: Behavior check against local wrangler dev
        run: node scripts/verify.mjs --evidence "${{ runner.temp }}/verify-evidence"

      - name: Upload verify evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verify-evidence
          path: ${{ runner.temp }}/verify-evidence
          if-no-files-found: ignore
